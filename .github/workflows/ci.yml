name: Continuous Integration

on:
  push:
    branches:
      - master
      - desktop-gui
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3
  SDL_VERSION: 3.4.14
  QT_QPA_PLATFORM: offscreen
  SDL_AUDIODRIVER: dummy

jobs:
  linux-build-test:
    name: Linux ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgl1-mesa-dev libegl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: qt-linux-${{ env.QT_VERSION }}

      - name: Build SDL
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          install-linux-dependencies: true
          version: ${{ env.SDL_VERSION }}

      - name: Configure
        run: >-
          cmake -S . -B build/ci-${{ matrix.build_type }} -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DGENPLUSGX_BUILD_DESKTOP=ON

      - name: Build
        run: cmake --build build/ci-${{ matrix.build_type }} --parallel 2

      - name: Test
        run: >-
          ctest --test-dir build/ci-${{ matrix.build_type }}
          --output-on-failure --no-tests=error --timeout 120

      - name: Install and package portable Linux application
        if: matrix.build_type == 'Release'
        run: |
          cmake --install build/ci-Release --prefix "$PWD/build/package-root"
          cmake -DPACKAGE_ROOT="$PWD/build/package-root" \
            -DVERIFY_PLATFORM=linux -P cmake/VerifyPackage.cmake
          build/package-root/bin/genesis-plus-gx-gui --version
          cpack --config build/ci-Release/CPackConfig.cmake \
            -G TGZ -B build/packages

      - name: Upload portable Linux package
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: Genesis-Plus-GX-GUI-linux-x86_64
          path: build/packages/*
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: linux-${{ matrix.build_type }}-test-diagnostics
          path: |
            build/ci-${{ matrix.build_type }}/Testing/Temporary/LastTest.log
            build/ci-${{ matrix.build_type }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  linux-sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgl1-mesa-dev libegl1-mesa-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: qt-linux-${{ env.QT_VERSION }}

      - name: Build SDL
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          install-linux-dependencies: true
          version: ${{ env.SDL_VERSION }}

      - name: Configure sanitizers
        run: >-
          cmake -S . -B build/ci-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DGENPLUSGX_BUILD_DESKTOP=ON
          -DGENPLUSGX_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build/ci-asan --parallel 2

      - name: Test
        run: >-
          ctest --test-dir build/ci-asan
          --output-on-failure --no-tests=error --timeout 120

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: linux-sanitizer-test-diagnostics
          path: |
            build/ci-asan/Testing/Temporary/LastTest.log
            build/ci-asan/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  linux-libretro-regression:
    name: Linux legacy libretro build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build inherited libretro target
        run: make -f Makefile.libretro platform=unix -j2

      - name: Clean inherited libretro target
        if: always()
        run: make -f Makefile.libretro platform=unix clean

  windows-build-test:
    name: Windows MSVC x64 ${{ matrix.build_type }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: qt-windows-msvc2022-${{ env.QT_VERSION }}

      - name: Build SDL
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          add-to-environment: true
          build-type: ${{ matrix.build_type }}
          discriminator: windows-msvc-x64-${{ matrix.build_type }}
          version: ${{ env.SDL_VERSION }}

      - name: Configure
        run: >-
          cmake -S . -B build/ci-windows
          -A x64
          -DBUILD_TESTING=ON
          -DGENPLUSGX_BUILD_DESKTOP=ON

      - name: Build
        run: >-
          cmake --build build/ci-windows
          --config ${{ matrix.build_type }} --parallel 2

      - name: Test
        run: >-
          ctest --test-dir build/ci-windows
          -C ${{ matrix.build_type }}
          --output-on-failure --no-tests=error --timeout 120

      - name: Install and package portable Windows application
        if: matrix.build_type == 'Release'
        run: |
          cmake --install build/ci-windows --config Release --prefix build/package-root
          cmake "-DPACKAGE_ROOT=$pwd/build/package-root" `
            -DVERIFY_PLATFORM=windows -P cmake/VerifyPackage.cmake
          & ./build/package-root/bin/genesis-plus-gx-gui.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cpack --config build/ci-windows/CPackConfig.cmake `
            -C Release -G ZIP -B build/packages

      - name: Upload portable Windows package
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: Genesis-Plus-GX-GUI-windows-x86_64
          path: build/packages/*
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: windows-msvc-x64-${{ matrix.build_type }}-test-diagnostics
          path: |
            build/ci-windows/Testing/Temporary/LastTest.log
            build/ci-windows/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore

  macos-build-test:
    name: macOS ${{ matrix.host.architecture }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        host:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
        build_type:
          - Debug
          - Release

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          cache-key-prefix: >-
            qt-macos-${{ matrix.host.architecture }}-${{ env.QT_VERSION }}

      - name: Build SDL
        uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
        with:
          add-to-environment: true
          build-type: ${{ matrix.build_type }}
          discriminator: >-
            macos-${{ matrix.host.architecture }}-${{ matrix.build_type }}
          version: ${{ env.SDL_VERSION }}

      - name: Configure
        run: >-
          cmake -S . -B build/ci-${{ matrix.build_type }} -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DGENPLUSGX_BUILD_DESKTOP=ON

      - name: Build
        run: cmake --build build/ci-${{ matrix.build_type }} --parallel 2

      - name: Test
        run: >-
          ctest --test-dir build/ci-${{ matrix.build_type }}
          --output-on-failure --no-tests=error --timeout 120

      - name: Install and package native macOS application
        if: matrix.build_type == 'Release'
        run: |
          cmake --install build/ci-Release --prefix "$PWD/build/package-root"
          cmake -DPACKAGE_ROOT="$PWD/build/package-root" \
            -DVERIFY_PLATFORM=macos -P cmake/VerifyPackage.cmake
          build/package-root/genesis-plus-gx-gui.app/Contents/MacOS/genesis-plus-gx-gui \
            --version
          cpack --config build/ci-Release/CPackConfig.cmake \
            -G ZIP -B build/packages
          cpack --config build/ci-Release/CPackConfig.cmake \
            -G DragNDrop -B build/packages

      - name: Upload native macOS packages
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: >-
            Genesis-Plus-GX-GUI-macos-${{ matrix.host.architecture }}
          path: build/packages/*
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: >-
            macos-${{ matrix.host.architecture }}-${{ matrix.build_type }}-test-diagnostics
          path: |
            build/ci-${{ matrix.build_type }}/Testing/Temporary/LastTest.log
            build/ci-${{ matrix.build_type }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
